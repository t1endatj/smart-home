
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
#controls { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
button { font-size: 12px; padding: 5px 14px; cursor: pointer; border-radius: 6px;
  border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary);
  color: var(--color-text-primary); }
button:hover { background: var(--color-background-secondary); }
button.active { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
#wrap { position: relative; width: 100%; }
#wrap canvas { width: 100% !important; height: auto !important; display: block; border-radius: 10px; }
#tooltip { position: absolute; display: none; background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-secondary); border-radius: 8px;
  padding: 8px 12px; font-size: 12px; color: var(--color-text-primary);
  pointer-events: none; max-width: 200px; line-height: 1.6; z-index: 10; }
#legend { display: flex; gap: 12px; font-size: 11px; color: var(--color-text-secondary);
  margin-top: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
.leg { display: flex; align-items: center; gap: 5px; }
.dot { width: 12px; height: 12px; border-radius: 3px; }
</style>

<div id="controls">
  <button id="btn-persp" class="active" onclick="setView('persp')">Góc nhìn 3D</button>
  <button id="btn-top"   onclick="setView('top')">Mặt bằng 2D</button>
  <button id="btn-front" onclick="setView('front')">Nhìn từ trước</button>
  <button                onclick="resetCamera()">↺ Đặt lại</button>
</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="tooltip"></div>
</div>
<div id="legend">
  <div class="leg"><div class="dot" style="background:#c0623a"></div>Cửa</div>
  <div class="leg"><div class="dot" style="background:#5bb8d4;opacity:.8"></div>Lối thông</div>
  <div class="leg"><div class="dot" style="background:#ffe066"></div>Đèn</div>
  <div class="leg"><div class="dot" style="background:#55cc77"></div>Cảm biến</div>
  <div class="leg"><div class="dot" style="background:#4a6fa5"></div>Điện tử</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// ════════════════════════════════════════
// LAYOUT CUỐI (theo bản vẽ tay + giữ HL từ ảnh 3D)
//
// Tổng: 60(x) × 40(z)
// z=0 = phía trước (nam), z=40 = phía sau (bắc)
//
// CỘT TRÁI x=0..20
//   Hành Lang : z=30..40  (nhỏ, trên — giữ nguyên từ ảnh)
//   Phòng Ngủ : z=12..30  (giữa)
//   Nhà VS    : z=0..12   (dưới)
//
// CỘT GIỮA x=20..45
//   Phòng Khách: z=0..40  (toàn bộ)
//
// CỘT PHẢI x=45..60
//   Khu KT    : z=28..40  (nhỏ, trên)
//   Nhà Bếp   : z=0..28   (lớn, dưới)
// ════════════════════════════════════════

const RW=1200, RH=720;
const canvas=document.getElementById('c');
canvas.width=RW; canvas.height=RH;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(RW,RH); renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe8e4da);
scene.fog=new THREE.Fog(0xe8e4da,120,220);

const HX=30,HY=2,HZ=20;
const camera=new THREE.PerspectiveCamera(44,RW/RH,0.1,300);
let view='persp', cs={phi:Math.PI/2.7, theta:-Math.PI*0.25, r:80};

function updateCam(){
  camera.up.set(0,1,0);
  if(view==='top'){
    camera.position.set(HX,115,HZ); camera.up.set(0,0,-1); camera.lookAt(HX,0,HZ);
  } else if(view==='front'){
    camera.position.set(HX,18,-68); camera.lookAt(HX,3,HZ);
  } else {
    const{phi,theta,r}=cs;
    camera.position.set(HX+r*Math.sin(phi)*Math.sin(theta), HY+r*Math.cos(phi), HZ+r*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(HX,HY,HZ);
  }
}
updateCam();

scene.add(new THREE.AmbientLight(0xfff8f0,0.7));
const sun=new THREE.DirectionalLight(0xfff4e0,0.95);
sun.position.set(60,90,40); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=sun.shadow.camera.bottom=-100;
sun.shadow.camera.right=sun.shadow.camera.top=100;
sun.shadow.bias=-0.001; scene.add(sun);

function B(w,h,d,col,x,y,z,name,info){
  const mat=col instanceof THREE.Material?col:new THREE.MeshLambertMaterial({color:col});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  if(name){m.userData.name=name;m.userData.info=info||'';}
  scene.add(m); return m;
}

function wallFan(x,y,z,side,name,info){
  const fanM=new THREE.MeshLambertMaterial({color:0x8f969a});
  const cageM=new THREE.MeshLambertMaterial({color:0xb9c0c3,transparent:true,opacity:.42});
  const hubM=new THREE.MeshLambertMaterial({color:0x4b5560});
  const rot=side==='west'?Math.PI/2:-Math.PI/2;
  const base=B(.22,1.6,1.6,fanM,x,y,z,name,info);
  const cage=new THREE.Mesh(new THREE.CylinderGeometry(.82,.82,.16,32),cageM);
  cage.position.set(x+(side==='west' ? .16 : -.16),y,z); cage.rotation.z=rot;
  cage.castShadow=true; cage.receiveShadow=true; cage.userData=base.userData; scene.add(cage);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.22,24),hubM);
  hub.position.set(x+(side==='west' ? .28 : -.28),y,z); hub.rotation.z=rot;
  hub.castShadow=true; hub.receiveShadow=true; hub.userData=base.userData; scene.add(hub);
  for(let i=0;i<3;i++){
    const blade=B(.08,.18,.68,0xd8dde0,x+(side==='west' ? .32 : -.32),y,z,name,info);
    blade.rotation.x=i*Math.PI*2/3;
    blade.position.y+=Math.sin(blade.rotation.x)*.25;
    blade.position.z+=Math.cos(blade.rotation.x)*.25;
  }
}

function ceilingFan(x,y,z,name,info){
  const base=B(.18,.65,.18,0x777777,x,y+.34,z,name,info);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.18,28),new THREE.MeshLambertMaterial({color:0x555b60}));
  hub.position.set(x,y,z); hub.castShadow=true; hub.receiveShadow=true; hub.userData=base.userData;
  scene.add(hub);
  for(let i=0;i<4;i++){
    const blade=B(3.4,.08,.42,0xbfc5c8,x,y,z,name,info);
    blade.rotation.y=i*Math.PI/2;
  }
}

function wallPictureNorth(x,y,z,w,name,info){
  const tex=new THREE.TextureLoader().load(WALL_IMAGE_DATA);
  tex.encoding=THREE.sRGBEncoding;
  const h=w*(168/180);
  const mat=new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide});
  const pic=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  pic.position.set(x,y,z); pic.rotation.y=Math.PI;
  pic.userData.name=name; pic.userData.info=info;
  scene.add(pic);
  B(w+.22,.08,.08,0x5b4635,x,y+h/2+.06,z-.02);
  B(w+.22,.08,.08,0x5b4635,x,y-h/2-.06,z-.02);
  B(.08,h+.22,.08,0x5b4635,x-w/2-.06,y,z-.02);
  B(.08,h+.22,.08,0x5b4635,x+w/2+.06,y,z-.02);
}

// ── LABELS ──
function lbl(text,x,y,z,sc){
  const cv=document.createElement('canvas'); cv.width=340; cv.height=64;
  const c2=cv.getContext('2d');
  c2.font='bold 22px sans-serif'; c2.fillStyle='#2a2a2a'; c2.textAlign='center';
  c2.fillText(text,170,42);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));
  sp.position.set(x,y,z); sp.scale.set(sc||10,2,1); scene.add(sp);
}

// ── INTERACTION ──
let drag=false,lx=0,ly=0;
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  cs.theta-=(e.clientX-lx)*.007;
  cs.phi=Math.max(.08,Math.min(Math.PI/2-.05,cs.phi+(e.clientY-ly)*.006));
  lx=e.clientX;ly=e.clientY;updateCam();
});
canvas.addEventListener('wheel',e=>{e.preventDefault();cs.r=Math.max(18,Math.min(160,cs.r+e.deltaY*.06));updateCam();},{passive:false});
let lt=null;
canvas.addEventListener('touchstart',e=>lt=e.touches[0]);
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();if(!lt)return;
  cs.theta-=(e.touches[0].clientX-lt.clientX)*.007;
  cs.phi=Math.max(.08,Math.min(Math.PI/2-.05,cs.phi+(e.touches[0].clientY-lt.clientY)*.006));
  lt=e.touches[0];updateCam();
},{passive:false});

const tip=document.getElementById('tooltip'),ray=new THREE.Raycaster(),ms=new THREE.Vector2();
canvas.addEventListener('mousemove',e=>{
  if(drag){tip.style.display='none';return;}
  const r=canvas.getBoundingClientRect();
  ms.x=((e.clientX-r.left)/r.width)*2-1;
  ms.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ms,camera);
  const hit=ray.intersectObjects(scene.children,true).find(h=>h.object.userData.name);
  if(hit){
    tip.style.display='block';
    tip.style.left=(e.clientX-r.left+12)+'px';
    tip.style.top=(e.clientY-r.top-8)+'px';
    tip.innerHTML=`<strong>${hit.object.userData.name}</strong><br>${hit.object.userData.info}`;
  } else tip.style.display='none';
});

function setView(v){
  view=v;
  document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('btn-'+v); if(btn)btn.classList.add('active');
  camera.fov=v==='top'?52:44; camera.updateProjectionMatrix(); updateCam();
}
function resetCamera(){cs={phi:Math.PI/2.7,theta:-Math.PI*.25,r:80};setView('persp');}
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);})();
